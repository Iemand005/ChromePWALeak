<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PWA memory leak</title>

	<meta name="theme-color" content="#ff0000">

	<link rel="manifest" href="manifest.json">

	<script>
		const metaTag = document.querySelector('meta[name="theme-color"]');

		let keepLeaking = true;

		function leak(enable = true) {
			keepLeaking = enable;
			while (keepLeaking) {
				metaTag.content = "#ff0000";
				metaTag.content = "#00ff00";
			}
		}
	</script>
</head>
<body>
	Please install me and check the box to start leaking!
	<label for="leak"></label>
	<input type="checkbox" name="leak" id="leak" onchange="leak(this.checked)">
</body>
</html>
