<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PWA memory leak</title>

	<meta name="theme-color" content="#ff0000">

	<link rel="manifest" href="manifest.json">

	<script>
		const metaTag = document.querySelector('meta[name="theme-color"]');


		function leak() {
			for (let i = 0; i < 10; i++) {
				metaTag.content = "#ff0000";
				metaTag.content = "#00ff00";
			}
		}
		function crash() { while (true) leak() }
	</script>
</head>
<body>
	Please install me and check the box to start leaking!
	<button onclick="leak()">Leak!</button>
	<button onclick="crash()">Crash!</button>
</body>
</html>
